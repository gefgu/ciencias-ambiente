name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - uses: typst-community/setup-typst@v4
      - run: for m in m1 m2 m3 m4; do typst compile report/$m.typ /tmp/$m.pdf; done
