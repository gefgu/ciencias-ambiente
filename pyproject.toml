[project]
name = "m1-mobilidade"
version = "0.1.0"
description = "M1 (Conceber) - Mobilidade Urbana e Sustentabilidade, Quadrilátero Central de Curitiba"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40",
  "pydeck",
  "plotly",
  "pandas",
  "geopandas",
  "pyarrow",
  "osmnx",
  "geobr",
  "fastmob[geo]",
  "requests",
  "pydantic>=2",
  "overturemaps>=1.0.3",
  "matplotlib>=3.10.9",
  "eclipse-sumo>=1.28.0",
  "traci>=1.28.0",
  "sumolib>=1.28.0",
  "scipy>=1.15.3",
  "rtree>=1.4.1",
  "paho-mqtt>=2.2.0",
  "amqtt>=0.12.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
